<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Murim Cultivator — an idle wuxia RPG</title>
<script>
/* Pre-paint: dress the page before first render. No logic, just prefs. */
try {
  var s = JSON.parse(localStorage.getItem("murim_v2") || "null");
  var ui = (s && s.ui) || {};
  var st = (s && s.settings) || {};
  var theme = ui.theme || st.theme || ((window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "night" : "day");
  var size = ui.textSize || st.textSize || "m";
  var fs = { s: "12px", m: "13px", l: "15px" }[size] || "13px";
  document.documentElement.style.fontSize = fs;
  document.addEventListener("DOMContentLoaded", function () {
    document.body.dataset.theme = theme === "night" ? "night" : "day";
  });
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body data-theme="day">
<div id="app">

  <!-- Title menu -->
  <section id="screen-user" class="screen active" aria-labelledby="userTitle">
    <div class="menubg" aria-hidden="true"><div class="menushade"></div></div>
    <div class="menupanel frame">
      <div class="carve"><span class="seal" aria-hidden="true"></span><span>A xianxia idle RPG</span></div>
      <h1 id="userTitle" class="gametitle" tabindex="-1">Murim Cultivator</h1>
      <p class="tagline">Gather. Forge. Slay. Be reborn.</p>
      <form id="nameForm" novalidate>
        <label class="field" for="inName">Name your cultivator</label>
        <input id="inName" maxlength="16" placeholder="e.g. Nameless" autocomplete="off" aria-describedby="userErr hasSave" />
        <p id="userErr" class="err" role="alert"></p>
        <p class="btnrow">
          <button type="button" id="btnContinue" class="btn" hidden>Continue</button>
          <button type="submit" id="btnToPath" class="btn btn-primary btn-big">New journey</button>
        </p>
        <p class="dim small" id="hasSave"></p>
      </form>
    </div>
  </section>

  <!-- Path menu -->
  <section id="screen-path" class="screen" aria-labelledby="pathTitle">
    <div class="menubg" aria-hidden="true"><div class="menushade"></div></div>
    <div class="menupanel frame wide">
      <div class="carve"><span class="seal" aria-hidden="true"></span><span>Second step</span></div>
      <h2 id="pathTitle" tabindex="-1">Choose a path, <span id="pathNameEcho"></span></h2>
      <p class="dim">One road for the whole life. Tab to a path, Enter begins.</p>
      <div class="pathgrid" id="pathRow" role="radiogroup" aria-label="Cultivation paths"></div>
      <p id="pathErr" class="err" role="alert"></p>
      <p class="btnrow">
        <button type="button" id="btnBackUser" class="btn">Back</button>
        <button type="button" id="btnToGame" class="btn btn-primary btn-big" disabled>Enter the mountain</button>
      </p>
    </div>
  </section>

  <!-- Lobby: one plate, three bars, one button -->
  <section id="screen-lobby" class="screen" aria-labelledby="lobbyTitle">
    <div id="lobbyScene" class="scenebg" aria-hidden="true"></div>
    <div class="corner tl">
      <button type="button" id="btnMenu" class="iiibtn frame" aria-label="Menu" aria-expanded="false"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
    </div>
    <div class="corner tr">
      <button type="button" id="btnPauseL" class="btn btn-small" data-tip="Still the world. The idle tick stops.">Pause</button>
      <button type="button" id="btnSettingsL" class="btn btn-small" data-tip="Dress, sound, records, danger.">Settings</button>
    </div>
    <div class="lobbycol">
      <h1 id="lobbyTitle" tabindex="-1"><span class="seal" aria-hidden="true"></span>Murim Cultivator</h1>
      <p class="plate"><b id="lobbyName">—</b><span class="smallcaps" id="lobbySub">—</span></p>
      <div class="lbars" role="group" aria-label="Vital energies">
        <div class="bar hp" id="barHpL" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i><b id="hpInL">–</b></div>
        <div class="bar qi" id="barQiL" role="progressbar" aria-label="Qi" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20"><i></i><b id="qiInL">–</b></div>
        <div class="bar cult" id="barCultL" role="progressbar" aria-label="Cultivation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><b id="cultInL">–</b></div>
      </div>
      <p class="cultbtnrow"><button type="button" id="btnCultivate" class="btn btn-primary btn-cultivate">Cultivate</button><span id="cultReady" class="readymark" hidden>ready</span></p>
      <p class="goalwrap"><button type="button" id="goalLine" class="goalline"><span class="smallcaps">Next · </span><span id="goalTextL">—</span></button></p>
      <div id="tipBubbleL" class="tipbubble" hidden>
        <span id="tipTextL"></span>
        <span class="tipbtns"><button type="button" id="tipSkipL" class="btn btn-small">Skip tips</button></span>
      </div>
    </div>
    <div id="pausedVeilL" class="pausedveil" hidden>Paused</div>
    <footer class="foot" id="footL">MURIM CULTIVATOR v3-phase5</footer>
  </section>

  <!-- Cultivate: the avatar, dead center -->
  <section id="screen-cultivate" class="screen" aria-labelledby="cultTitle">
    <div id="cultScene" class="scenebg" aria-hidden="true"></div>
    <h2 id="cultTitle" class="sr" tabindex="-1">Cultivate</h2>
    <div class="corner tl btnrow">
      <button type="button" id="btnMenuC" class="iiibtn frame" aria-label="Menu" aria-expanded="false"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
      <button type="button" id="btnLobby" class="btn btn-small btn-quiet">Back to lobby</button>
    </div>
    <div class="corner tr btnrow">
      <button type="button" id="btnPauseC" class="btn btn-small" data-tip="Still the world. The idle tick stops.">Pause</button>
      <button type="button" id="btnSettingsC" class="btn btn-small" data-tip="Dress, sound, records, danger.">Settings</button>
    </div>
    <div class="cultgrid">
      <div class="cultcol">
        <div class="focuscards" role="radiogroup" aria-label="Attention">
          <label class="focuscard" data-tip="A quarter more cultivation."><input type="radio" name="focus" value="cult" checked /><b>Circulate Qi</b><span>More cultivation.</span></label>
          <label class="focuscard" data-tip="Near a third more gathering."><input type="radio" name="focus" value="gather" /><b>Sense Herbs</b><span>More gathering.</span></label>
          <label class="focuscard" data-tip="Harder strikes, richer kills."><input type="radio" name="focus" value="fight" /><b>Temper Body</b><span>Harder strikes.</span></label>
        </div>
        <div class="chips" id="rateChipsC"></div>
      </div>
      <div class="spritestage">
        <div id="spriteBox"></div>
        <div id="floatsC" aria-hidden="true"></div>
        <div id="banner" class="banner" hidden></div>
        <div id="tipBubbleC" class="tipbubble" hidden>
          <span id="tipTextC"></span>
          <span class="tipbtns"><button type="button" id="tipSkipC" class="btn btn-small">Skip tips</button></span>
        </div>
      </div>
      <div class="cultcol">
        <p class="btnrow colbtns">
          <button type="button" id="btnMedC" class="btn" data-tip="Three seconds of idle gain, at once. Key Space.">Meditate</button>
          <button type="button" id="btnBreakC" class="btn btn-primary btn-tall" data-tip="Spend a full measure for the next stage.">Breakthrough</button>
          <button type="button" id="btnDoorC" class="btn doorfill" data-tip="Thirty breaths at triple gain."><i></i><b>Closed door x3</b></button>
        </p>
        <p class="toggles">
          <label class="switch"><input type="checkbox" id="optCultC" checked /><span>Cultivate</span><b>On</b></label>
          <label class="switch"><input type="checkbox" id="optBreakC" checked /><span>Breakthrough</span><b>On</b></label>
        </p>
        <p class="dim" id="cultNeed"></p>
      </div>
    </div>
    <div class="cbars" role="group" aria-label="Vital energies">
      <div class="bar hp" id="barHpC" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i><b id="hpInC">–</b></div>
      <div class="bar qi" id="barQiC" role="progressbar" aria-label="Qi" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20"><i></i><b id="qiInC">–</b></div>
      <div class="bar cult" id="barCultC" role="progressbar" aria-label="Cultivation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><b id="cultInC">–</b></div>
    </div>
    <div id="pausedVeilC" class="pausedveil" hidden>Paused</div>
  </section>

  <!-- III drawer -->
  <div id="drawerBackdrop" hidden></div>
  <aside id="drawer" aria-label="Menu" hidden>
    <div class="carve"><span class="seal" aria-hidden="true"></span><span>Menu</span></div>
    <nav id="drawerNav" aria-label="Sections"></nav>
  </aside>

  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal frame">
      <div class="carve"><span class="seal" aria-hidden="true"></span><span id="modalTitle">—</span></div>
      <div id="modalBody"></div>
      <p id="modalBtns" class="btnrow"></p>
    </div>
  </div>

  <div id="toasts" aria-live="polite" aria-label="Notices"></div>
</div>
<script src="js/config.js"></script>
<script src="js/formulas.js"></script>
<script src="js/state.js"></script>
<script src="js/stage.js"></script>
<script src="js/avatar.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/actions.js"></script>
<script src="js/loop.js"></script>
</body>
</html>
